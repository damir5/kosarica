_meta:
  version: "1.0"
  updated_at: "2026-02-06T00:00:00Z"
  updated_by: "system"
  description: "Staples extraction rules"
product_type_rules:
  - id: "eggs"
    product_type: "eggs"
    patterns:
      - "\\bjaja\\b"
    flags: "iu"
  - id: "flour"
    product_type: "flour"
    patterns:
      - "\\bbra[sš]no\\b"
    flags: "iu"
  - id: "sugar"
    product_type: "sugar"
    patterns:
      - "\\b(s[eš]e[cć]er|sec?er)\\b"
    flags: "iu"
  - id: "oil"
    product_type: "oil"
    patterns:
      - "\\bulje\\b"
    flags: "iu"
  - id: "bread"
    product_type: "bread"
    patterns:
      - "\\b(kruh|kru[hb]|kruh?)\\b"
    flags: "iu"
  - id: "butter"
    product_type: "butter"
    patterns:
      - "\\bmaslac\\b"
    flags: "iu"
  - id: "coffee"
    product_type: "coffee"
    patterns:
      - "\\bkava\\b"
      - "\\bcoffee\\b"
    flags: "iu"
attribute_rules:
  - id: "grade"
    attribute: "grade"
    pattern: "(?:razred|klasa|grade)\\s*(?<grade>[ASMLXL]{1,2}|t[- ]?\\d{3})"
    target_group: "grade"
    transform: "lowercase"
    flags: "iu"
  - id: "count"
    attribute: "count"
    pattern: "(?<count>\\d+)\\s*(kom|pcs|komad)\\b"
    target_group: "count"
    transform: "number"
    flags: "iu"
  - id: "volume"
    attribute: "volume"
    pattern: "(?<value>\\d+(?:[\\.,]\\d+)?)\\s*(?<unit>kg|g|gr|l|lt|lit|ltr|ml|kom)\\b"
    target_group: "value"
    transform: "number"
    flags: "iu"
