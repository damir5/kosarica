_meta:
  version: "1.0"
  updated_at: "2026-02-06T00:00:00Z"
  updated_by: "system"
  description: "General extraction rules shared across categories"
product_type_rules: []
attribute_rules:
  - id: "multipack-count"
    attribute: "multipack_count"
    pattern: "(?<count>\\d+)\\s*[xX×]\\s*\\d+(?:[\\.,]\\d+)?\\s*(kg|g|gr|l|lt|lit|ltr|ml|kom)"
    target_group: "count"
    transform: "number"
    flags: "iu"
  - id: "organic"
    attribute: "organic"
    pattern: "\\b(?<organic>bio|eko|organic)\\b"
    target_group: "organic"
    transform: "boolean"
    flags: "iu"
  - id: "volume"
    attribute: "volume"
    pattern: "(?<value>\\d+(?:[\\.,]\\d+)?)\\s*(?<unit>kg|g|gr|l|lt|lit|ltr|ml|kom)\\b"
    target_group: "value"
    transform: "number"
    flags: "iu"
