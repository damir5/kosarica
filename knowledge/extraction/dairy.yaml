_meta:
  version: "1.0"
  updated_at: "2026-02-06T00:00:00Z"
  updated_by: "system"
  description: "Dairy extraction rules"
product_type_rules:
  - id: "milk-fresh"
    product_type: "milk-fresh"
    patterns:
      - "\\bsvj(?:eze|eže)?\\s*mlijeko\\b"
      - "\\bmlijeko\\b"
    anti_patterns:
      - "\\btraj(?:no|n)\\b"
      - "\\buht\\b"
    flags: "iu"
  - id: "milk-uht"
    product_type: "milk-uht"
    patterns:
      - "\\btraj(?:no|n)\\s*mlijeko\\b"
      - "\\buht\\b"
    flags: "iu"
  - id: "yogurt"
    product_type: "yogurt"
    patterns:
      - "\\b(jogurt|yogurt)\\b"
      - "\\btekuci jogurt\\b"
    flags: "iu"
attribute_rules:
  - id: "fat-percent"
    attribute: "fat_percent"
    pattern: "(?<fat>\\d(?:[\\.,]\\d)?)\\s*%"
    target_group: "fat"
    transform: "number"
    flags: "iu"
  - id: "packaging"
    attribute: "packaging"
    pattern: "(?<pack>pet|tetrapak|čaša|casa|cup)"
    target_group: "pack"
    transform: "lowercase"
    flags: "iu"
  - id: "volume"
    attribute: "volume"
    pattern: "(?<value>\\d+(?:[\\.,]\\d+)?)\\s*(?<unit>kg|g|gr|l|lt|lit|ltr|ml|kom)\\b"
    target_group: "value"
    transform: "number"
    flags: "iu"
