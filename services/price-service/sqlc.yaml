version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/database/queries/"
    schema:
      - "schema.sql"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/database/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        emit_empty_slices: true
        overrides:
          - column: "task_queue.payload"
            go_type:
              import: "github.com/kosarica/price-service/internal/jsonb"
              type: "TaskQueuePayload"
          - column: "retailer_items_failed.validation_errors"
            go_type:
              import: "github.com/kosarica/price-service/internal/jsonb"
              type: "ValidationErrors"
          - column: "cron_jobs.task_payload"
            go_type:
              import: "github.com/kosarica/price-service/internal/jsonb"
              type: "CronJobPayload"
              pointer: true
          - column: "cron_runs.metadata"
            go_type:
              import: "github.com/kosarica/price-service/internal/jsonb"
              type: "CronRunMetadata"
              pointer: true
          - column: "archives.metadata"
            go_type:
              import: "github.com/kosarica/price-service/internal/jsonb"
              type: "ArchiveMetadata"
