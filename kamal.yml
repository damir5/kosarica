# Kamal deployment configuration for Kosarica
# See: https://kamal-deploy.org/

service: kosarica
image: kosarica/app
registry:
  # Kamal local registry mode (no external container registry)
  # Default works for host-native deploys. In containerized operator environments,
  # override with KAMAL_REGISTRY_SERVER=host.docker.internal:5500.
  server: <%= ENV.fetch("KAMAL_REGISTRY_SERVER", "localhost:5500") %>

# Public app host (TLS via kamal-proxy + Let's Encrypt)
proxy:
  ssl: true
  host: kosarica.chickenkiller.com
  app_port: 3000
  healthcheck:
    path: /
    interval: 10
    timeout: 10

# Deployment servers
servers:
  web:
    - kosarica.chickenkiller.com

# Environment variables
env:
  clear:
    NODE_ENV: production
    PORT: 3000
    LOG_LEVEL: info
    NODE_OPTIONS: --enable-source-maps
    WEB_CONCURRENCY: 2
    STORAGE_BACKEND: s3
    STORAGE_PATH: /app/data/storage
    TEMP_STORAGE_PATH: /app/data/temp
    S3_FORCE_PATH_STYLE: "true"
    CLICKHOUSE_URL: http://kosarica-clickhouse:8123
    CLICKHOUSE_IMPORT_MODE: http
    CLICKHOUSE_USER_FILES_SUBDIR: storage
    OTEL_EXPORTER_OTLP_ENDPOINT: kosarica-opentelemetry-collector:4317
    OTEL_SERVICE_NAME: kosarica-nodejs
    APP_VERSION: 0.1.0
    APP_RELEASE: "<%= `git rev-parse --short HEAD`.strip %>"
    VERTEX_EXPRESS_RPM: 10
    UNIFIED_MATCHING_MAX_GROUP_SIZE: 45
    UNIFIED_MATCHING_GROUPS_PER_CALL: 1
    LISTWISE_MIN_PRIMARY_CONFIDENCE: 0.85
    CATEGORIZATION_RPM_LIMIT: 10
    CATEGORIZATION_BATCH_SIZE: 30
    # Parallel in-flight requests, still gated by CATEGORIZATION_RPM_LIMIT.
    # Use > RPM to keep the pipeline full when individual requests take >60s.
    CATEGORIZATION_BACKFILL_CONCURRENCY: 20
  secret:
    # Secret env vars
    - POSTGRES_PASSWORD
    - DATABASE_URL
    - BETTER_AUTH_SECRET
    - BETTER_AUTH_URL
    - PASSKEY_RP_ID
    - PASSKEY_RP_NAME
    - ZO_ROOT_USER_EMAIL
    - ZO_ROOT_USER_PASSWORD
    - ZO_BASIC_AUTH
    - ZO_ORG_ID
    - LOCAL_LLM_API_KEY
    - NIM_API_KEY
    - OPENROUTER_API_KEY
    - ZAI_API_KEY
    - VERTEX_EXPRESS_API_KEY
    - S3_ENDPOINT
    - S3_REGION
    - S3_BUCKET
    - S3_PREFIX
    - S3_ACCESS_KEY_ID
    - S3_SECRET_ACCESS_KEY

# Builder configuration
builder:
  arch: amd64
  dockerfile: Dockerfile
  context: .
  args:
    BUILD_TIME: "<%= Time.now.utc.strftime('%Y-%m-%dT%H:%M:%SZ') %>"
    GIT_COMMIT: "<%= `git rev-parse --short HEAD`.strip %>"
    BUILD_ENV: production
    APP_VERSION: 0.1.0
    APP_RELEASE: "<%= `git rev-parse --short HEAD`.strip %>"

# Volume mounts (for persistent storage)
volumes:
  - /app/data:/app/data
  - /app/logs:/app/logs
  - /var/lib/kosarica/sourcemaps:/app/sourcemaps

# Accessories (services that run alongside the main app)
accessories:
  # PostgreSQL database
  postgres:
    image: pgvector/pgvector:pg16
    host: kosarica.chickenkiller.com
    env:
      clear:
        POSTGRES_USER: kosarica
        POSTGRES_DB: kosarica
      secret:
        - POSTGRES_PASSWORD
    directories:
      - /var/lib/kosarica/postgres:/var/lib/postgresql/data

  # ClickHouse database (internal only)
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    host: kosarica.chickenkiller.com
    env:
      clear:
        CLICKHOUSE_SKIP_USER_SETUP: "1"
    directories:
      - /var/lib/kosarica/clickhouse:/var/lib/clickhouse
      - /app/data/storage:/var/lib/clickhouse/user_files/storage

  # OpenTelemetry Collector
  opentelemetry-collector:
    image: otel/opentelemetry-collector-contrib:latest
    host: kosarica.chickenkiller.com
    options:
      user: "0:0"
    env:
      secret:
        - ZO_BASIC_AUTH
        - ZO_ORG_ID
    files:
      - deployment/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    directories:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro

  # OpenObserve observability platform
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    host: kosarica.chickenkiller.com
    env:
      clear:
        ZO_MEMORY_CACHE_ENABLED: "false"
        ZO_COMPACT_ENABLED: "true"
      secret:
        - ZO_ROOT_USER_EMAIL
        - ZO_ROOT_USER_PASSWORD
    directories:
      - /var/lib/kosarica/openobserve:/data

# SSH options
ssh:
  user: root
  port: 22
  # Use your SSH key
  # keys: ["~/.ssh/id_ed25519"]

# Logging options
logging:
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
