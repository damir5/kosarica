# Kamal deployment configuration for Kosarica
# See: https://kamal-deploy.org/

service: kosarica
image: kosarica/app
registry:
  # Kamal local registry mode (no external container registry)
  # When server starts with "localhost", Kamal bootstraps a registry on the host.
  # Use 5500 to avoid common host conflicts on macOS with system services on 5000.
  server: localhost:5500

# Public app host (TLS via kamal-proxy + Let's Encrypt)
proxy:
  ssl: true
  host: kosarica.duckdns.org
  app_port: 3000
  healthcheck:
    path: /
    interval: 10
    timeout: 10

# Deployment servers
servers:
  web:
    - kosarica.duckdns.org

# Environment variables
env:
  clear:
    NODE_ENV: production
    PORT: 3000
    LOG_LEVEL: info
    NODE_OPTIONS: --enable-source-maps
    WEB_CONCURRENCY: 2
    STORAGE_PATH: /app/data/storage
    TEMP_STORAGE_PATH: /app/data/temp
    CLICKHOUSE_URL: http://kosarica-clickhouse:8123
    OTEL_EXPORTER_OTLP_ENDPOINT: kosarica-opentelemetry-collector:4317
    OTEL_SERVICE_NAME: kosarica-nodejs
    APP_VERSION: 0.1.0
    APP_RELEASE: "<%= `git rev-parse --short HEAD`.strip %>"
  secret:
    # Secret env vars
    - POSTGRES_PASSWORD
    - DATABASE_URL
    - BETTER_AUTH_SECRET
    - BETTER_AUTH_URL
    - PASSKEY_RP_ID
    - PASSKEY_RP_NAME
    - ZO_ROOT_USER_EMAIL
    - ZO_ROOT_USER_PASSWORD
    - ZO_BASIC_AUTH
    - ZO_ORG_ID
    - LLM_ENSEMBLE_JSON
    - LOCAL_LLM_API_KEY

# Builder configuration
builder:
  arch: amd64
  dockerfile: Dockerfile
  context: .
  args:
    BUILD_TIME: "<%= Time.now.utc.strftime('%Y-%m-%dT%H:%M:%SZ') %>"
    GIT_COMMIT: "<%= `git rev-parse --short HEAD`.strip %>"
    BUILD_ENV: production
    APP_VERSION: 0.1.0
    APP_RELEASE: "<%= `git rev-parse --short HEAD`.strip %>"

# Volume mounts (for persistent storage)
volumes:
  - /app/data:/app/data
  - /app/logs:/app/logs
  - /var/lib/kosarica/sourcemaps:/app/sourcemaps

# Accessories (services that run alongside the main app)
accessories:
  # PostgreSQL database
  postgres:
    image: pgvector/pgvector:pg16
    host: kosarica.duckdns.org
    env:
      clear:
        POSTGRES_USER: kosarica
        POSTGRES_DB: kosarica
      secret:
        - POSTGRES_PASSWORD
    directories:
      - /var/lib/kosarica/postgres:/var/lib/postgresql/data

  # ClickHouse database (internal only)
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    host: kosarica.duckdns.org
    env:
      clear:
        CLICKHOUSE_SKIP_USER_SETUP: "1"
    directories:
      - /var/lib/kosarica/clickhouse:/var/lib/clickhouse

  # OpenTelemetry Collector
  opentelemetry-collector:
    image: otel/opentelemetry-collector-contrib:latest
    host: kosarica.duckdns.org
    options:
      user: "0:0"
    env:
      secret:
        - ZO_BASIC_AUTH
        - ZO_ORG_ID
    files:
      - deployment/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    directories:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro

  # OpenObserve observability platform
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    host: kosarica.duckdns.org
    env:
      clear:
        ZO_MEMORY_CACHE_ENABLED: "false"
        ZO_COMPACT_ENABLED: "true"
      secret:
        - ZO_ROOT_USER_EMAIL
        - ZO_ROOT_USER_PASSWORD
    directories:
      - /var/lib/kosarica/openobserve:/data

# SSH options
ssh:
  user: root
  port: 22
  # Use your SSH key
  # keys: ["~/.ssh/id_ed25519"]

# Logging options
logging:
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
