[tools]
node = "24"
go = "latest"

[tasks.dev]
description = "Start dev server (Node.js)"
run = "pnpm dev"

[tasks.build]
description = "Build the project (Node.js)"
run = "pnpm build"

[tasks.start]
description = "Start production server (Node.js)"
run = "pnpm start"

[tasks.test]
description = "Run tests (Node.js vitest)"
run = "pnpm test"

[tasks.lint]
description = "Run linter (Node.js biome)"
run = "pnpm lint"

[tasks.format]
description = "Format code (Node.js biome)"
run = "pnpm format"

[tasks.db-generate]
description = "Generate DB migrations (Node.js)"
run = "pnpm db:generate"

[tasks.db-migrate]
description = "Run DB migrations (Node.js)"
run = "pnpm db:migrate"

[tasks.db-studio]
description = "Open Drizzle Studio (Node.js)"
run = "pnpm db:studio"

[tasks.sqlc-generate]
description = "Generate sqlc Go code from queries"
dir = "services/price-service"
run = "go run github.com/sqlc-dev/sqlc/cmd/sqlc@latest generate"

[tasks.swag]
description = "Generate OpenAPI spec from Go annotations"
dir = "services/price-service"
run = "go run github.com/swaggo/swag/cmd/swag@v1.16.4 init -g cmd/server/main.go -o docs"

[tasks.generate-go-api]
description = "Generate TypeScript SDK from Go OpenAPI spec"
run = "pnpm generate:go-api"

[tasks.generate-all]
description = "Regenerate all codegen: JSONB types, sqlc, OpenAPI, and TypeScript SDK"
depends = ["generate-jsonb", "sqlc-generate", "swag", "generate-go-api"]
run = "echo '==> All codegen complete!'"

[tasks.generate-jsonb]
description = "Generate JSONB types (Zod -> JSON Schema -> Go)"
run = "pnpm generate:jsonb"

[tasks.reset-data]
description = "Reset database and storage (preserves admin users). Add --yes or --dry-run flags as needed"
run = "bash -c 'set -a; source .env.development; set +a; exec ./scripts/reset-data.sh \"$@\"' bash"
