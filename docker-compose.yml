services:
  # Dev PostgreSQL (persistent) — pgvector image for vector similarity search
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["dev"]
    container_name: ade-postgres
    environment:
      POSTGRES_USER: kosarica
      POSTGRES_PASSWORD: kosarica
      POSTGRES_DB: kosarica
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosarica"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Test PostgreSQL (ephemeral) — pgvector image for vector similarity search
  postgres-test:
    image: pgvector/pgvector:pg16
    profiles: ["test"]
    container_name: ade-postgres-test
    environment:
      POSTGRES_USER: kosarica_test
      POSTGRES_PASSWORD: kosarica_test
      POSTGRES_DB: kosarica_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosarica_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dev ClickHouse (persistent)
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    profiles: ["dev"]
    container_name: ade-clickhouse
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Test ClickHouse (ephemeral)
  clickhouse-test:
    image: clickhouse/clickhouse-server:24.3-alpine
    profiles: ["test"]
    container_name: ade-clickhouse-test
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      - "8124:8123"
      - "9001:9000"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  clickhouse_data:
