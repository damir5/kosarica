# OpenTelemetry Collector Configuration for Kosarica
#
# Architecture:
#   App (Pino JSON -> stdout) -> Docker json-file -> filelog receiver -> OpenObserve
#   App (OTel SDK)            -> OTLP gRPC receiver                  -> OpenObserve
#   Host metrics              -> hostmetrics receiver                 -> OpenObserve
#
# Log parsing pipeline:
#   Docker JSON -> route by format -> Pino JSON path (extract fields, map severity)
#                                  -> Plain text path (passthrough)

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  # OTLP receiver for application telemetry (traces + metrics via gRPC/HTTP)
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Host metrics (CPU, memory, disk, network, processes)
  # Note: Running inside container reports container-scoped filesystem stats.
  # To get host stats, mount host root at /hostfs and set root_path: /hostfs
  hostmetrics:
    collection_interval: 60s
    scrapers:
      cpu:
      load:
      memory:
      disk:
      filesystem:
      network:
      processes:

  # Docker container logs via json-file driver
  # Reads all container logs, routes Pino JSON vs plain text
  filelog/docker:
    include:
      - /var/lib/docker/containers/*/*-json.log
    include_file_path: true
    include_file_name: true
    start_at: end
    operators:
      # 1. Parse Docker json-file envelope: extracts log, stream, time
      - type: json_parser
        id: parse_docker
        parse_from: body
        timestamp:
          parse_from: attributes.time
          layout_type: gotime
          layout: "2006-01-02T15:04:05.999999999Z07:00"

      # 2. Route: JSON logs (Pino/kamal-proxy) vs plain text logs
      #    Note: Docker log lines include trailing \n, so match with \s*$
      - type: router
        id: route_format
        routes:
          - expr: 'attributes.log matches "^\\{.*\\}\\s*$"'
            output: parse_pino
        default: set_text_body

      # === Pino JSON path ===

      # 3a. Parse Pino structured JSON (extracts msg, level, loggerType, etc.)
      - type: json_parser
        id: parse_pino
        parse_from: attributes.log

      # 3b. Map log level to OTel severity
      #     Pino uses numeric: 10=trace, 20=debug, 30=info, 40=warn, 50=error, 60=fatal
      #     kamal-proxy uses uppercase strings: INFO, WARN, ERROR
      - type: severity_parser
        id: map_severity
        parse_from: attributes.level
        mapping:
          trace:
            - 10
            - "TRACE"
          debug:
            - 20
            - "DEBUG"
          info:
            - 30
            - "INFO"
          warn:
            - 40
            - "WARN"
          error:
            - 50
            - "ERROR"
          fatal:
            - 60
            - "FATAL"

      # 3c. Promote Pino message to log body
      - type: move
        id: set_pino_body
        from: attributes.msg
        to: body

      # 3d. Remove raw Docker log (already parsed into attributes)
      - type: remove
        id: clean_pino_raw
        field: attributes.log
        output: tag_source

      # === Plain text path ===

      # 4. Use raw log text as body
      - type: move
        id: set_text_body
        from: attributes.log
        to: body

      # === Merge point ===

      # 5. Tag all Docker-sourced logs
      - type: add
        id: tag_source
        field: attributes.log_source
        value: docker

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 1024

  memory_limiter:
    check_interval: 10s
    limit_mib: 512
    spike_limit_mib: 128

  # Common resource attributes for all telemetry
  resource:
    attributes:
      - key: environment
        value: production
        action: upsert
      - key: deployment.type
        value: docker
        action: upsert

  # Drop noisy internal logs (OpenObserve access logs, collector self-logs)
  filter/drop_internal:
    logs:
      log_record:
        - 'body != nil and IsMatch(body, "config::axum::middlewares::access_log")'
        - 'body != nil and IsMatch(body, "OpenTelemetry Collector Contrib")'

exporters:
  # OpenObserve exporter for logs
  otlp_http/openobserve_logs:
    endpoint: http://kosarica-openobserve:5080/api/${env:ZO_ORG_ID}
    headers:
      Authorization: "Basic ${env:ZO_BASIC_AUTH}"
      stream-name: "kosarica-logs"
      stream-type: "logs"
    tls:
      insecure: true
    encoding: json

  # OpenObserve exporter for metrics
  otlp_http/openobserve_metrics:
    endpoint: http://kosarica-openobserve:5080/api/${env:ZO_ORG_ID}
    headers:
      Authorization: "Basic ${env:ZO_BASIC_AUTH}"
      stream-name: "kosarica-metrics"
      stream-type: "metrics"
    tls:
      insecure: true
    encoding: json

  # OpenObserve exporter for traces
  otlp_http/openobserve_traces:
    endpoint: http://kosarica-openobserve:5080/api/${env:ZO_ORG_ID}
    headers:
      Authorization: "Basic ${env:ZO_BASIC_AUTH}"
      stream-name: "kosarica-traces"
      stream-type: "traces"
    tls:
      insecure: true
    encoding: json

  # Debug exporter (for troubleshooting, disable in production)
  # debug:
  #   verbosity: basic
  #   sampling_initial: 5
  #   sampling_thereafter: 200

service:
  extensions:
    - health_check

  pipelines:
    # Logs pipeline: OTLP (app SDK) + filelog (Docker containers) -> OpenObserve
    logs:
      receivers:
        - otlp
        - filelog/docker
      processors:
        - memory_limiter
        - filter/drop_internal
        - resource
        - batch
      exporters:
        - otlp_http/openobserve_logs

    # Metrics pipeline
    metrics:
      receivers:
        - otlp
        - hostmetrics
      processors:
        - memory_limiter
        - resource
        - batch
      exporters:
        - otlp_http/openobserve_metrics

    # Traces pipeline
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - resource
        - batch
      exporters:
        - otlp_http/openobserve_traces
