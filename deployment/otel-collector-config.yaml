# OpenTelemetry Collector Configuration for Kosarica
# Receives logs and metrics from Node.js and Go services, sends to OpenObserve

extensions:
  # Health check extension
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  # OTLP receiver for application telemetry (gRPC)
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Host metrics receiver
  hostmetrics:
    collection_interval: 60s
    scrapers:
      cpu:
      load:
      memory:
      disk:
      filesystem:
      network:
      processes:

  # Collect Docker json-file logs (includes application stdout/stderr).
  filelog/docker:
    include:
      - /var/lib/docker/containers/*/*-json.log
    include_file_path: true
    start_at: end
    operators:
      - type: json_parser
        id: parse_docker_json
        parse_from: body
        timestamp:
          parse_from: attributes.time
          layout_type: gotime
          layout: "2006-01-02T15:04:05.999999999Z07:00"
      # Parse structured pino JSON payloads emitted by the app.
      - type: json_parser
        id: parse_pino_json
        parse_from: attributes.log
        if: 'attributes.log matches "^\\{.*\\}$"'

  # Docker container stats
  # Note: This requires the container to run with Docker socket access
  # docker_stats:
  #   endpoint: /var/run/docker.sock
  #   container_ids: []
  #   timeout: 10s

processors:
  # Batch telemetry for better performance
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 1024

  # Memory limiter processor
  memory_limiter:
    check_interval: 10s
    limit_mib: 512
    spike_limit_mib: 128

  # Resource processor to add common attributes
  resource:
    attributes:
      - key: environment
        value: production
        action: upsert
      - key: deployment.type
        value: docker
        action: upsert

  # Filter processor to drop unwanted metrics
  # Uncomment and adjust as needed
  # filter/metrics:
  #   metrics:
  #     include:
  #       match_type: regexp
  #       metric_names: [".*"]

exporters:
  # OpenObserve exporter for logs
  otlp_http/openobserve_logs:
    endpoint: http://kosarica-openobserve:5080/api/${env:ZO_ORG_ID}
    headers:
      Authorization: "Basic ${env:ZO_BASIC_AUTH}"
      stream-name: "kosarica-logs"
      stream-type: "logs"
    tls:
      insecure: true
    encoding: json

  # OpenObserve exporter for metrics
  otlp_http/openobserve_metrics:
    endpoint: http://kosarica-openobserve:5080/api/${env:ZO_ORG_ID}
    headers:
      Authorization: "Basic ${env:ZO_BASIC_AUTH}"
      stream-name: "kosarica-metrics"
      stream-type: "metrics"
    tls:
      insecure: true
    encoding: json

  # OpenObserve exporter for traces
  otlp_http/openobserve_traces:
    endpoint: http://kosarica-openobserve:5080/api/${env:ZO_ORG_ID}
    headers:
      Authorization: "Basic ${env:ZO_BASIC_AUTH}"
      stream-name: "kosarica-traces"
      stream-type: "traces"
    tls:
      insecure: true

  # Debug exporter (for troubleshooting, disable in production)
  # logging:
  #   verbosity: detailed

service:
  extensions:
    - health_check

  pipelines:
    # Logs pipeline
    logs:
      receivers:
        - otlp
        - filelog/docker
      processors:
        - memory_limiter
        - resource
        - batch
      exporters:
        - otlp_http/openobserve_logs

    # Metrics pipeline
    metrics:
      receivers:
        - otlp
        - hostmetrics
      processors:
        - memory_limiter
        - resource
        - batch
      exporters:
        - otlp_http/openobserve_metrics

    # Traces pipeline
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - resource
        - batch
      exporters:
        - otlp_http/openobserve_traces
