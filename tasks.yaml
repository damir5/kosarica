  # Collaborative Review
  - title: "Collaborative Review: SQL Migration Tracking List"
    description: |
      Multi-model collaborative review with weighted consensus.

      ## Review Process
      Use `/dev:collab reviewer consensus` to review implementation.

      Models (from ~/claude-collab/collaboration.yaml):
      1. github-copilot/gpt-5.2 (weight: 3) - Implementation review
      2. github-copilot/gemini-3-pro-preview (weight: 3) - Architecture review
      3. opencode/grok-code (weight: 1) - Investigation/fact-checking
      4. claude-cli/opus (weight: 4) - Final comprehensive review

      ## Consensus Rules
      - Load weights from ~/claude-collab/collaboration.yaml
      - Model weights: grok=1, gemini-pro=3, gpt-5.2=3, opus=4
      - If models disagree, favor higher-weighted model opinions
      - All critical issues flagged by ANY model must be addressed
      - Document consensus and any dissenting opinions

      ## Review Focus Areas
      - All TypeScript migrations properly use Drizzle `sql` template tags
      - All Go migrations have proper sqlc query definitions
      - PL/pgSQL exceptions are properly justified (shared code, sqlc limitations, Postgres-specific features)
      - Type safety is maintained (no type assertions on query results)
      - SQL injection vulnerabilities are prevented
      - ON CONFLICT handling is preserved
      - RETURNING clauses are properly handled
      - Transaction boundaries are respected
      - Complex operations (temp tables, advisory locks, SET LOCAL) are kept as raw SQL with comments

      ## Migration Summary
      - **TypeScript (3 files)**: 8 migrations to Drizzle
      - **Go (10 files)**: 22 migrations to sqlc, 8 exceptions kept
      - **New sqlc files**: 6 (matching.sql, ai_matching.sql, cleanup.sql, embeddings.sql, optimizer.sql, taskqueue_extended.sql)
    completed: false
