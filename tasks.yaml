tasks:
  # ==================================
  # PHASE 1: Environment Setup
  # ==================================

  - title: Reset database to clean state
    description: |
      Run `mise run reset-data --yes` to clear all ingestion data while preserving admin users.

      This ensures a known starting state for debugging. Verify with:
      ```sql
      SELECT COUNT(*) FROM retailer_items;  -- Should be 0
      SELECT COUNT(*) FROM stores;          -- Should be 0
      SELECT COUNT(*) FROM ingestion_runs;  -- Should be 0
      SELECT COUNT(*) FROM task_queue;      -- Should be 0
      ```
    completed: false

  - title: Start main Node.js app with logging
    description: |
      In Terminal 1, run:
      ```bash
      cd /workspace && mise run dev | tee log/log.txt
      ```

      Ensure the `log/` directory exists first:
      ```bash
      mkdir -p /workspace/log
      ```

      Verify app is running by checking for "Server listening on port" message.
      Keep this terminal open throughout the session.
    completed: false

  - title: Start Go price-service with logging
    description: |
      In Terminal 2, run:
      ```bash
      cd /workspace/services/price-service && mise run dev | tee ../../log/price-service.txt
      ```

      Verify service is running by checking for:
      - "Starting HTTP server on :8081" (or configured port)
      - "Starting worker pool" messages for each worker type
      - "Resuming interrupted runs" (may be empty on clean DB)

      Keep this terminal open throughout the session.
    completed: false

  - title: Verify service connectivity
    description: |
      Test that both services are running and can communicate:

      1. Check Node.js app health:
      ```bash
      curl http://localhost:3000/health
      ```

      2. Check Go service health:
      ```bash
      curl http://localhost:8081/health
      ```

      3. Test internal communication by listing chains:
      ```bash
      curl http://localhost:3000/api/chains
      ```

      All should return 200 OK responses.
    completed: false

  # ==================================
  # PHASE 2: Konzum Chain (Primary Test)
  # ==================================

  - title: "Konzum: Single-day ingestion test"
    description: |
      Trigger ingestion for Konzum with today's date:
      ```bash
      curl -X POST http://localhost:3000/api/price-service/trigger \
        -H "Content-Type: application/json" \
        -d '{"chain": "konzum", "targetDate": "2026-01-31"}'
      ```

      Expected: 202 Accepted with runId

      Monitor in Terminal 2 for:
      - "Discovered X files for konzum"
      - "Processing file X of Y"
      - "Ingestion completed for konzum"

      Check logs for ERROR, panic, deadlock keywords:
      ```bash
      grep -E "ERROR|panic|deadlock|timeout" log/price-service.txt
      ```
    completed: false

  - title: "Konzum: Verify single-day data integrity"
    description: |
      Run detection probes after Konzum ingestion:

      ```sql
      -- Row counts
      SELECT chain_slug, COUNT(*) as items FROM retailer_items
      WHERE chain_slug = 'konzum' GROUP BY chain_slug;

      -- Stores discovered
      SELECT chain_slug, COUNT(*) as stores FROM stores
      WHERE chain_slug = 'konzum' GROUP BY chain_slug;

      -- Run status
      SELECT id, status, total_files, processed_files, total_entries, error_count
      FROM ingestion_runs WHERE chain_slug = 'konzum' ORDER BY created_at DESC LIMIT 1;

      -- Price entries
      SELECT COUNT(*) as price_entries FROM store_item_state sis
      JOIN stores s ON sis.store_id = s.id WHERE s.chain_slug = 'konzum';
      ```

      Expected:
      - retailer_items count > 0 (typically 5,000-20,000 for Konzum)
      - stores count > 0 (Konzum has ~700 stores)
      - ingestion_runs.status = 'completed'
      - error_count = 0 or very low
    completed: false

  - title: "Konzum: Analyze and fix any single-day issues"
    description: |
      If single-day ingestion failed or has issues:

      1. Check run errors:
      ```sql
      SELECT * FROM ingestion_errors WHERE run_id = '<runId>' ORDER BY created_at;
      ```

      2. Check file processing status:
      ```sql
      SELECT filename, status, total_rows, processed_rows, failed_rows
      FROM ingestion_files WHERE run_id = '<runId>';
      ```

      3. Common issues to look for:
      - Deadlocks: Check for concurrent insert conflicts in store_item_state
      - Parse errors: Check column mapping in internal/adapters/chains/konzum.go
      - Connection exhaustion: Check pool settings in config/config.go
      - Timeout on discovery: Check rate limiting in konzum adapter

      4. Document the issue and fix applied before proceeding.
    completed: false

  - title: "Konzum: 7-day historical ingestion"
    description: |
      Once single-day works, test 7 consecutive days:

      ```bash
      for i in {0..6}; do
        date=$(date -d "2026-01-31 - $i days" +%Y-%m-%d)
        echo "Triggering konzum for $date"
        curl -X POST http://localhost:3000/api/price-service/trigger \
          -H "Content-Type: application/json" \
          -d "{\"chain\": \"konzum\", \"targetDate\": \"$date\"}"
        sleep 5  # Allow task to be queued
      done
      ```

      Monitor worker logs for parallel processing behavior.

      Key observations:
      - Do tasks queue correctly?
      - Are workers processing in parallel?
      - Any deadlocks during concurrent DB writes?
      - Memory usage stable?
    completed: false

  - title: "Konzum: Verify 7-day integrity and fix issues"
    description: |
      Verify all 7 runs completed successfully:

      ```sql
      SELECT target_date, status, total_files, processed_files, error_count
      FROM ingestion_runs
      WHERE chain_slug = 'konzum'
      ORDER BY target_date DESC LIMIT 7;
      ```

      All should show status = 'completed' and error_count = 0.

      If any failed:
      1. Identify the failure pattern (same day? random?)
      2. Check if it's a transient issue (retry successful?)
      3. Fix any systematic issues before moving to next chain

      Document findings.
    completed: false

  # ==================================
  # PHASE 3: Lidl Chain
  # ==================================

  - title: "Lidl: Single-day ingestion test"
    description: |
      Trigger Lidl ingestion (uses ZIP archives with per-store CSVs):
      ```bash
      curl -X POST http://localhost:3000/api/price-service/trigger \
        -H "Content-Type: application/json" \
        -d '{"chain": "lidl", "targetDate": "2026-01-31"}'
      ```

      Lidl-specific concerns:
      - ZIP file extraction
      - Multiple CSV files per ZIP
      - Different encoding per file (UTF-8 vs Windows-1250)

      Monitor for:
      - ZIP extraction errors
      - Encoding detection issues
      - Memory usage during large ZIP processing
    completed: false

  - title: "Lidl: Verify data and expand to 7 days"
    description: |
      Run probes for Lidl:
      ```sql
      SELECT chain_slug, COUNT(*) FROM retailer_items WHERE chain_slug = 'lidl';
      SELECT chain_slug, COUNT(*) FROM stores WHERE chain_slug = 'lidl';
      SELECT status, error_count FROM ingestion_runs WHERE chain_slug = 'lidl';
      ```

      If single-day works, run 7-day ingestion:
      ```bash
      for i in {0..6}; do
        date=$(date -d "2026-01-31 - $i days" +%Y-%m-%d)
        curl -X POST http://localhost:3000/api/price-service/trigger \
          -H "Content-Type: application/json" \
          -d "{\"chain\": \"lidl\", \"targetDate\": \"$date\"}"
        sleep 5
      done
      ```

      Fix any Lidl-specific issues before proceeding.
    completed: false

  # ==================================
  # PHASE 4: Interspar Chain
  # ==================================

  - title: "Interspar: Single-day ingestion test"
    description: |
      Trigger Interspar ingestion (JSON API discovery, CSV data):
      ```bash
      curl -X POST http://localhost:3000/api/price-service/trigger \
        -H "Content-Type: application/json" \
        -d '{"chain": "interspar", "targetDate": "2026-01-31"}'
      ```

      Interspar-specific concerns:
      - JSON API for store discovery
      - Pagination handling
      - Rate limiting on API calls
      - CSV with semicolon separator

      Monitor for API rate limiting (429 responses) and pagination edge cases.
    completed: false

  - title: "Interspar: Verify data and expand to 7 days"
    description: |
      Run probes:
      ```sql
      SELECT chain_slug, COUNT(*) FROM retailer_items WHERE chain_slug = 'interspar';
      SELECT chain_slug, COUNT(*) FROM stores WHERE chain_slug = 'interspar';
      ```

      If single-day succeeds, run 7-day ingestion and verify all complete.
      Document any rate limiting or API-specific issues.
    completed: false

  # ==================================
  # PHASE 5: Kaufland Chain
  # ==================================

  - title: "Kaufland: Single-day ingestion test"
    description: |
      Trigger Kaufland ingestion (JSON API discovery, tab-delimited data):
      ```bash
      curl -X POST http://localhost:3000/api/price-service/trigger \
        -H "Content-Type: application/json" \
        -d '{"chain": "kaufland", "targetDate": "2026-01-31"}'
      ```

      Kaufland-specific concerns:
      - Tab-delimited data (not comma)
      - JSON API for file discovery
      - German number format (comma as decimal separator)

      Watch for parsing issues with tab delimiter and decimal handling.
    completed: false

  - title: "Kaufland: Verify data and expand to 7 days"
    description: |
      Run probes and fix any Kaufland-specific issues.
      Expand to 7-day ingestion once single-day is stable.
    completed: false

  # ==================================
  # PHASE 6: Plodine Chain
  # ==================================

  - title: "Plodine: Single-day ingestion test"
    description: |
      Trigger Plodine ingestion (CSV in ZIP archives):
      ```bash
      curl -X POST http://localhost:3000/api/price-service/trigger \
        -H "Content-Type: application/json" \
        -d '{"chain": "plodine", "targetDate": "2026-01-31"}'
      ```

      Plodine-specific concerns:
      - ZIP archive handling (similar to Lidl)
      - Croatian number format
      - Different column headers

      Monitor ZIP extraction and CSV parsing.
    completed: false

  - title: "Plodine: Verify data and expand to 7 days"
    description: |
      Run probes and fix any Plodine-specific issues.
      Expand to 7-day ingestion once single-day is stable.
    completed: false

  # ==================================
  # PHASE 7: Remaining Chains (After Core Chains Stable)
  # ==================================

  - title: "Studenac: Test ingestion (XML format)"
    description: |
      Studenac uses XML format with dynamic store IDs:
      ```bash
      curl -X POST http://localhost:3000/api/price-service/trigger \
        -H "Content-Type: application/json" \
        -d '{"chain": "studenac", "targetDate": "2026-01-31"}'
      ```

      XML-specific concerns:
      - XML namespace handling
      - Dynamic store ID extraction from filenames
      - Large XML file parsing performance

      Test single-day first, then expand.
    completed: false

  - title: "DM: Test ingestion (XLSX format)"
    description: |
      DM uses XLSX files with numeric columns:
      ```bash
      curl -X POST http://localhost:3000/api/price-service/trigger \
        -H "Content-Type: application/json" \
        -d '{"chain": "dm", "targetDate": "2026-01-31"}'
      ```

      XLSX-specific concerns:
      - Excel file parsing (excelize library)
      - Numeric column type handling
      - Date/time cell formatting

      Test single-day, verify data, expand if successful.
    completed: false

  - title: "Eurospin: Test ingestion (HTML discovery)"
    description: |
      Eurospin uses HTML option tag discovery:
      ```bash
      curl -X POST http://localhost:3000/api/price-service/trigger \
        -H "Content-Type: application/json" \
        -d '{"chain": "eurospin", "targetDate": "2026-01-31"}'
      ```

      HTML-specific concerns:
      - HTML parsing for store/file discovery
      - JavaScript-rendered content (if any)
      - Form data extraction

      Test single-day, verify data, expand if successful.
    completed: false

  - title: "KTC: Test ingestion (Windows-1250 encoding)"
    description: |
      KTC uses CSV with Windows-1250 encoding:
      ```bash
      curl -X POST http://localhost:3000/api/price-service/trigger \
        -H "Content-Type: application/json" \
        -d '{"chain": "ktc", "targetDate": "2026-01-31"}'
      ```

      Encoding-specific concerns:
      - Windows-1250 → UTF-8 conversion
      - Croatian special characters (č, ć, ž, š, đ)
      - Encoding detection accuracy

      Verify product names display correctly with Croatian characters.
    completed: false

  - title: "Metro: Test ingestion (UTF-8 CSV)"
    description: |
      Metro uses standard UTF-8 CSV:
      ```bash
      curl -X POST http://localhost:3000/api/price-service/trigger \
        -H "Content-Type: application/json" \
        -d '{"chain": "metro", "targetDate": "2026-01-31"}'
      ```

      Should be straightforward. Test single-day and expand.
    completed: false

  - title: "Trgocentar: Test ingestion (XML with anchor prices)"
    description: |
      Trgocentar uses XML with dynamic anchor prices:
      ```bash
      curl -X POST http://localhost:3000/api/price-service/trigger \
        -H "Content-Type: application/json" \
        -d '{"chain": "trgocentar", "targetDate": "2026-01-31"}'
      ```

      Special concerns:
      - Anchor price calculation from XML
      - Croatian transparency law compliance

      Test single-day, verify anchor prices are captured correctly.
    completed: false

  # ==================================
  # PHASE 8: Full System Validation
  # ==================================

  - title: Verify all chains completed without errors
    description: |
      Run comprehensive probe across all chains:

      ```sql
      -- Summary by chain
      SELECT
        chain_slug,
        COUNT(*) as runs,
        SUM(CASE WHEN status = 'completed' THEN 1 ELSE 0 END) as completed,
        SUM(CASE WHEN status = 'failed' THEN 1 ELSE 0 END) as failed,
        SUM(error_count) as total_errors
      FROM ingestion_runs
      GROUP BY chain_slug
      ORDER BY chain_slug;

      -- Item counts by chain
      SELECT chain_slug, COUNT(*) as items
      FROM retailer_items GROUP BY chain_slug ORDER BY chain_slug;

      -- Store counts by chain
      SELECT chain_slug, COUNT(*) as stores
      FROM stores GROUP BY chain_slug ORDER BY chain_slug;

      -- Price entry counts by chain
      SELECT s.chain_slug, COUNT(*) as price_entries
      FROM store_item_state sis
      JOIN stores s ON sis.store_id = s.id
      GROUP BY s.chain_slug ORDER BY s.chain_slug;
      ```

      All chains should show:
      - completed runs > 0
      - failed runs = 0
      - items count > 0
      - stores count > 0
      - price_entries count > 0
    completed: false

  - title: Analyze logs for any remaining issues
    description: |
      Search logs for error patterns:

      ```bash
      # Price service errors
      grep -E "ERROR|panic|deadlock|timeout|connection refused|pool exhausted" log/price-service.txt

      # Node.js app errors
      grep -E "error|Error|ERR" log/log.txt

      # Task queue issues
      grep -E "task_queue|claim|orphan" log/price-service.txt
      ```

      Document any remaining issues that need future attention.
    completed: false

  - title: Document all problems found and fixes applied
    description: |
      Create a summary document of the debugging session:

      1. List each problem encountered
      2. Describe the symptoms (error message, behavior)
      3. Document the root cause analysis
      4. Record the fix applied (code changes, config changes)
      5. Note any workarounds or temporary fixes
      6. List any issues deferred for future work

      This documentation helps prevent regression and assists future debugging.

      Consider adding to /workspace/docs/ingestion-troubleshooting.md or similar.
    completed: false
