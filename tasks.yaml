  # Phase 3: Update persist.go (Barcode Fix)
  - title: Update persist.go to use sqlc and fix barcode saving
    description: |
      Goal: Replace raw SQL with sqlc, ensure barcode saved

      Key changes:
      1. Import `sqlcgen` package
      2. Replace `pool.Exec/Query` with `queries.XXX()`
      3. In `findOrCreateRetailerItem`: after creating item, insert first barcode to `retailer_item_barcodes`
      4. Remove duplicate barcode insertion loop (was inserting to non-existent table)

      Barcode flow:
      ```go
      // In persistRowsForStore or findOrCreateRetailerItem:
      if len(row.Barcodes) > 0 && row.Barcodes[0] != "" {
          queries.InsertRetailerItemBarcode(ctx, sqlcgen.InsertRetailerItemBarcodeParams{
              ID:             cuid2.Generate("rib"),
              RetailerItemID: itemID,
              Barcode:        row.Barcodes[0],
              IsPrimary:      true,
          })
      }
      ```
    completed: false

